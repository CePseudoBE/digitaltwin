# Local services for developing the framework and running the examples: see dev/README.md
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: digitaltwin
      POSTGRES_PASSWORD: digitaltwin
      POSTGRES_DB: digitaltwin
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: digitaltwin
      MINIO_ROOT_PASSWORD: digitaltwin-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    entrypoint:
      - sh
      - -c
      - until mc alias set local http://minio:9000 digitaltwin digitaltwin-secret; do sleep 1; done && mc mb --ignore-existing local/digitaltwin

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG_PATH: /config/config.json
    ports:
      - "8080:8080"
    volumes:
      - ./dev/oidc/config.json:/config/config.json:ro

volumes:
  postgres-data:
  minio-data:
